<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Không Tìm Thấy Trang | Liên đoàn Hướng đạo Long Biên</title>
  <meta name="description" content="Trang bạn đang tìm kiếm không tồn tại hoặc đã được chuyển sang vị trí mới. Khám phá các hoạt động và kỹ năng Hướng đạo Long Biên.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Roboto+Slab:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #113237;
      --forest-light: #1d4a50;
      --fire: #ed7b2b;
      --gold: #ffd166;
      --paper: #f7f9fa;
      --line: #e2e8f0;
      --ink: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .card-404 {
      background: #ffffff;
      border: 1.5px solid var(--line);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 48px rgba(17, 50, 55, 0.08);
    }
    .icon-404 {
      font-size: 64px;
      margin-bottom: 16px;
      display: inline-block;
      animation: floatCompass 3s ease-in-out infinite;
    }
    @keyframes floatCompass {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(8deg); }
    }
    h1 {
      font-family: 'Roboto Slab', Georgia, serif;
      font-size: 32px;
      color: var(--forest);
      margin-bottom: 12px;
      line-height: 1.2;
    }
    p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .actions-404 {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: var(--fire);
      color: #ffffff;
      border: none;
    }
    .btn-primary:hover {
      background: #d96618;
      transform: translateY(-2px);
    }
    .btn-outline {
      background: transparent;
      color: var(--forest);
      border: 1.5px solid var(--forest);
    }
    .btn-outline:hover {
      background: var(--forest);
      color: #ffffff;
    }
    .quick-links {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
    }
    .quick-links a {
      color: var(--forest);
      text-decoration: none;
      font-weight: 600;
      margin: 0 8px;
    }
    .quick-links a:hover {
      color: var(--fire);
    }
  </style>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

</head>
<body>
  <div class="card-404">
    <div class="icon-404">🧭</div>
    <h1>Lạc Đường Trong Rừng?</h1>
    <p>Trang bạn đang tìm kiếm dường như đã đổi vị trí hoặc không tồn tại. Đừng lo, một Hướng đạo sinh luôn biết cách tìm đường về lều trại chính!</p>
    <div class="actions-404">
      <a href="/" class="btn btn-primary">🏕️ Về Trang Chủ Long Biên</a>
      <a href="/#ky-nang" class="btn btn-outline">🧭 Khám Phá Kho Kỹ Năng</a>
    </div>
    <div class="quick-links">
      <span>Lối tắt:</span>
      <a href="/#quy-trinh">Gia nhập</a> ·
      <a href="/#cac-nganh">Các ngành</a> ·
      <a href="/#goc-phu-huynh">Góc phụ huynh</a> ·
      <a href="/#thu-vien-tai-lieu">Tài liệu</a>
    </div>
  </div>
</body>
</html>
